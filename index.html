<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교생활 아이디어 제안함</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-hover: #45a049;
            --error-color: #f44336;
            --bg-color: #f9f9f9;
            --container-bg: #ffffff;
            --text-color: #333;
            --border-color: #ddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }
        .char-count {
            display: flex;
            justify-content: flex-end;
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
        }
        .char-count.error {
            color: var(--error-color);
            font-weight: bold;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .instruction {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.4;
            text-align: center;
            background-color: #e8f5e9;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
        }
        .url-warning {
             background-color: #ffebee;
             color: #c62828;
             padding: 10px;
             border-radius: 6px;
             margin-bottom: 20px;
             text-align: center;
             display: none; /* 기본적으로 숨김 */
             border-left: 4px solid var(--error-color);
             font-weight: bold;
        }
        /* Mobile optimization */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.3rem;
            }
            input[type="text"],
            select,
            textarea {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💡 학교생활 아이디어 제안함</h1>
        <div id="urlWarning" class="url-warning">
            <!-- 자바스크립트를 통해 경고 메시지가 삽입됩니다. -->
        </div>
        <div class="instruction">
            학교 Google 계정으로 로그인한 브라우저에서 이용하세요.<br>
            제안서를 작성하여 제출해 주세요.<br>
            제출 결과는 <strong>새 탭에서 확인</strong>할 수 있습니다.
        </div>
        <form id="ideaForm" method="POST" target="_blank" rel="noopener" novalidate>
            <div class="form-group">
                <label for="userCode">가상 코드 (예: A1042)</label>
                <input type="text" id="userCode" name="userCode" placeholder="알파벳 대문자 1개 + 숫자 4자리">
            </div>
            <div class="form-group">
                <label for="category">분야 선택</label>
                <select id="category" name="category">
                    <option value="">-- 분야를 선택해 주세요 --</option>
                    <option value="학습">학습 (수업, 평가 등)</option>
                    <option value="시설">시설 (교실, 체육관, 매점 등)</option>
                    <option value="생활">생활 (급식, 교복, 행사 등)</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <div class="form-group">
                <label for="idea">제안 내용 (10자 이상 300자 이하)</label>
                <textarea id="idea" name="idea" placeholder="구체적인 아이디어를 작성해 주세요."></textarea>
                <div class="char-count" id="charCount">앞뒤 공백 제외 0 / 300자</div>
            </div>
            <button type="submit" id="submitBtn">제안하기 (새 탭에서 확인)</button>
        </form>
    </div>
    <script>
        // 1. 설정 및 초기화
        const GAS_WEB_APP_URL = "https://script.google.com/a/macros/hcu.hs.kr/s/AKfycbwUHJcbtV-Y08gu-NGcdM0F4tIFlqqcoVQublNk5fNl27BUOYABXQPwPBnAs4SjlBZgfA/exec"; 
        function isValidGasUrl(value) {
          try {
            const url = new URL(value.trim());
            return url.protocol === 'https:'
              && url.hostname === 'script.google.com'
              && url.port === ''
              && url.username === ''
              && url.password === ''
              && url.search === ''
              && url.hash === ''
              && /^\/(?:macros\/s|a\/macros\/[^/]+\/s)\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname);
          } catch {
            return false;
          }
        }
        const form = document.getElementById('ideaForm');
        const userCodeInput = document.getElementById('userCode');
        const categorySelect = document.getElementById('category');
        const ideaTextarea = document.getElementById('idea');
        const charCountDisplay = document.getElementById('charCount');
        const urlWarning = document.getElementById('urlWarning');
        // 2. 글자 수 세기 이벤트 (실시간 피드백)
        ideaTextarea.addEventListener('input', function() {
            // trim()을 사용하여 앞뒤 공백을 제외한 글자 수를 계산합니다.
            const currentLength = this.value.trim().length;
            charCountDisplay.textContent = `앞뒤 공백 제외 ${currentLength} / 300자`;
            if (currentLength > 0 && (currentLength < 10 || currentLength > 300)) {
                charCountDisplay.classList.add('error');
            } else {
                charCountDisplay.classList.remove('error');
                this.setCustomValidity('');
            }
        });
        // 3. 폼 제출 이벤트 핸들러
        form.addEventListener('submit', function(event) {
            // 기존 에러 메시지 초기화
            userCodeInput.setCustomValidity('');
            categorySelect.setCustomValidity('');
            ideaTextarea.setCustomValidity('');
            urlWarning.style.display = "none"; // 경고창 숨기기
            // --- 데이터 정규화 및 조건 검사 ---
            // [가상 코드 검사]
            let codeVal = userCodeInput.value.trim().toUpperCase();
            userCodeInput.value = codeVal; 
            const codeRegex = /^[A-Z][0-9]{4}$/;
            if (!codeVal) {
                userCodeInput.setCustomValidity('가상 코드를 입력해 주세요.');
            } else if (!codeRegex.test(codeVal)) {
                userCodeInput.setCustomValidity('가상 코드는 알파벳 대문자 1개와 숫자 4자리여야 합니다. (예: A1042)');
            }
            // [분야 검사]
            if (!categorySelect.value) {
                categorySelect.setCustomValidity('분야를 선택해 주세요.');
            }
            // [제안 내용 검사]
            let ideaVal = ideaTextarea.value.trim();
            ideaTextarea.value = ideaVal; 
            const ideaLen = ideaVal.length; 
            // 제출 시 공백 제거 후 글자 수 다시 갱신
            charCountDisplay.textContent = `앞뒤 공백 제외 ${ideaLen} / 300자`;
            if (ideaLen === 0) {
                ideaTextarea.setCustomValidity('제안 내용을 입력해 주세요.');
            } else if (ideaLen < 10) {
                ideaTextarea.setCustomValidity(`내용이 너무 짧습니다. 현재 앞뒤 공백 제외 ${ideaLen}자입니다. 최소 10자 이상 작성해 주세요.`);
            } else if (ideaLen > 300) {
                ideaTextarea.setCustomValidity(`내용이 너무 깁니다. 현재 앞뒤 공백 제외 ${ideaLen}자입니다. 최대 300자까지 작성 가능합니다.`);
            }
            // --- 1단계: 폼 입력 요소 검증 처리 ---
            if (!form.checkValidity()) {
                event.preventDefault(); // 기본 전송 차단
                form.reportValidity();  // 브라우저 기본 툴팁으로 사용자에게 오류 안내
                return; // 입력 오류가 있으면 서버 주소 검사로 넘어가지 않음
            } 
            // --- 2단계: 서버 주소(URL) 검사 처리 ---
            if (!isValidGasUrl(GAS_WEB_APP_URL)) {
                event.preventDefault(); // 입력 검사는 통과했으나 서버 주소가 잘못되었으므로 전송 차단
                urlWarning.textContent = "입력 검사는 통과했습니다. 실제 저장을 위해 올바른 서버 주소를 설정하세요.";
                urlWarning.style.display = "block";
            } else {
                // 모든 검사를 통과한 경우
                form.action = GAS_WEB_APP_URL.trim(); 
                // target="_blank"에 의해 새 탭에서 결과(서버 응답)가 열립니다.
                // 현재 화면에는 "저장 완료"라는 메시지를 표시하지 않고 그대로 둡니다.
            }
        });
        // 4. 입력 중 오류 메시지 제거
        userCodeInput.addEventListener('input', () => userCodeInput.setCustomValidity(''));
        categorySelect.addEventListener('change', () => categorySelect.setCustomValidity(''));
    </script>
</body>
</html>
